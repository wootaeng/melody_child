<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#e8f2ee" />
<title>오늘 이야기로 동요 만들기</title>
<style>
  :root {
    color-scheme: light;

    /* 민트 종이 위의 청록 잉크. 코랄은 목소리에만 쓴다 —
       페이지에서 가장 뜨거운 색이 곧 아이 목소리다. */
    --ground: #e8f2ee;
    --card: #fdfefd;
    --ink: #16323c;
    --ink-soft: #5c7a80;
    --voice: #f0654a;
    --voice-rest: #f6c5b6;
    --beat: #f5c64c;
    --rule: #b9d4ca;

    /* ui-rounded는 iOS·macOS에서 SF Rounded로 잡힌다. 아이용 화면에
       맞는 둥근 끝을 외부 폰트 없이 얻는 유일한 경로다. */
    --face: ui-rounded, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 2rem 1.25rem 3rem;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--face);
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }

  main { max-width: 30rem; margin: 0 auto; }

  .eyebrow {
    margin: 0;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    color: var(--ink-soft);
  }

  h1 {
    margin: 0.35rem 0 0;
    font-size: clamp(2rem, 11vw, 2.9rem);
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1.08;
  }

  h1 em { font-style: normal; color: var(--voice); }

  /* 시그니처: 음절 구슬. 음 하나가 구슬 하나, 높이가 음높이, 크기가 음 길이. */
  #beads {
    display: block;
    width: 100%;
    height: 148px;
    margin: 1.75rem 0 1.5rem;
  }

  .stage { min-height: 11.5rem; }

  button {
    font: inherit;
    font-weight: 700;
    border: 0;
    border-radius: 999px;
    background: var(--ink);
    color: var(--card);
    padding: 0.7rem 1.15rem;
    cursor: pointer;
  }

  button:focus-visible { outline: 3px solid var(--voice); outline-offset: 3px; }

  #start, #stop {
    width: 100%;
    font-size: 1.15rem;
    padding: 1.15rem 1.5rem;
    background: var(--voice);
  }

  .ghost { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--rule); }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 1.25rem; }
  .actions #replay { grid-column: 1 / -1; background: var(--voice); }

  .hint { margin: 0.9rem 0 0; color: var(--ink-soft); font-size: 0.95rem; }

  /* 남은 녹음 시간 게이지. 줄어드는 폭이 곧 남은 시간이다 —
     진폭을 그리는 것보다 아이에게 쓸모 있는 정보다. */
  #meter {
    height: 0.6rem;
    border-radius: 999px;
    background: var(--rule);
    overflow: hidden;
  }
  #remaining {
    height: 100%;
    background: var(--voice);
    transform-origin: left center;
    transform: scaleX(1);
  }
  #remaining.counting { animation: countdown linear forwards; }
  @keyframes countdown {
    from { transform: scaleX(1); }
    to { transform: scaleX(0); }
  }
  .countdown-label { margin: 0.5rem 0 0; font-size: 0.9rem; font-weight: 700; color: var(--ink-soft); }

  #live-transcript {
    margin: 1rem 0 0;
    min-height: 3.2em;
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  /* 사실만 담는 칩 — 절 수와 음절 수는 아이가 확인할 수 있는 정보다. */
  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 0.75rem; padding: 0; list-style: none; }
  .chips li {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 0.3rem 0.6rem;
    border-radius: 999px;
    background: var(--card);
    box-shadow: inset 0 0 0 1.5px var(--rule);
  }

  #lyrics { margin: 0 0 1rem; font-size: 1.2rem; font-weight: 700; letter-spacing: -0.02em; }

  .voice-strip { margin: 0.5rem 0 0; }
  .voice-strip figcaption {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: var(--ink-soft);
    margin-bottom: 0.4rem;
  }
  #waveform { display: block; width: 100%; height: 56px; border-radius: 0.5rem; }

  /* 악기 선택. 선택 표시에 코랄(--voice)을 쓰지 않는다 — 화면에서 가장 뜨거운 색은
     아이 목소리여야 한다는 규칙을 지켜, 여기는 청록 잉크로 채운다. */
  .picker { border: 0; margin: 1.1rem 0 0; padding: 0; }
  .picker legend {
    padding: 0;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: var(--ink-soft);
    margin-bottom: 0.45rem;
  }
  .picker button {
    font-size: 0.85rem;
    padding: 0.45rem 0.85rem;
    margin: 0 0.35rem 0.35rem 0;
    background: var(--card);
    color: var(--ink);
    box-shadow: inset 0 0 0 1.5px var(--rule);
  }
  .picker button[aria-pressed='true'] {
    background: var(--ink);
    color: var(--card);
    box-shadow: none;
  }

  #notice, #stt-warning { margin: 0.9rem 0 0; color: #9c4a1c; font-size: 0.95rem; }
  #notice:empty { display: none; }

  /* 게이지는 남은 시간을 알려주는 정보라 reduced-motion에서도 유지한다.
     대신 매끄러운 진행 대신 1초 단위로 끊어 움직이게 해 흐르는 느낌을 줄인다. */
  @media (prefers-reduced-motion: reduce) {
    #remaining.counting { animation-timing-function: steps(30, end); }
  }
</style>

<main>
  <p class="eyebrow">내 목소리로</p>
  <h1>오늘 이야기가<br /><em>노래가 돼요</em></h1>

  <canvas id="beads" width="640" height="296" aria-hidden="true"></canvas>

  <div class="stage">
    <section id="screen-idle" hidden>
      <button id="start">녹음 시작</button>
      <p class="hint" id="limit-hint"></p>
      <p class="hint">또박또박 끊어서 말하면 음절이 잘 나뉘어요. 이야기가 길면 절이 늘어나요.</p>
    </section>

    <section id="screen-recording" hidden>
      <div id="meter"><div id="remaining"></div></div>
      <p class="countdown-label" id="countdown-label"></p>
      <p id="live-transcript"></p>
      <button id="stop">다 말했어요</button>
      <p id="stt-warning" hidden>이 브라우저는 받아쓰기를 지원하지 않아요. 노래는 그대로 만들어져요.</p>
    </section>

    <section id="screen-result" hidden>
      <ul class="chips" id="chips"></ul>
      <p id="lyrics" hidden></p>
      <figure class="voice-strip">
        <figcaption>내 목소리</figcaption>
        <canvas id="waveform" width="640" height="112"></canvas>
      </figure>
      <!-- 버튼은 ui.js가 INSTRUMENTS로 만든다 — 악기 이름을 두 곳에 적지 않는다 -->
      <fieldset id="instruments" class="picker">
        <legend>멜로디 악기</legend>
      </fieldset>
      <!-- 음량 단계도 ui.js가 만든다(MELODY_LEVELS) — 값을 두 곳에 적지 않는다 -->
      <fieldset id="melody-levels" class="picker">
        <legend>멜로디 음량</legend>
      </fieldset>
      <div class="actions">
        <button id="replay">다시 듣기</button>
        <button id="append">이어서 녹음</button>
        <button id="remix" class="ghost">새 멜로디</button>
        <button id="download" class="ghost">노래 저장</button>
        <button id="again" class="ghost">다시 녹음</button>
      </div>
    </section>
  </div>

  <p id="notice"></p>
</main>

<script type="module" src="./src/ui.js"></script>
